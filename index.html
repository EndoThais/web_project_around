<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afora</title>
    <meta name="description" content="EUA Afora" />
    <meta name="author" content="Thais Endo" />
    <meta name="keywords" content="Afora, história" />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="preconnect" href="./vendor/fonts.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="./vendor/fonts.css" rel="stylesheet" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__container">
          <img
            src="./images/Vector.svg"
            alt="Logotipo EUA Afora"
            class="header__container header__container_logo"
          />
        </div>
      </header>
      <main class="content">
        <section class="profile">
          <img
            class="profile__image"
            src="./images/Jacques_Costeau.jpg"
            alt="foto de Jaques Costeau"
          />
          <div class="profile__info">
            <div class="profile__artists">
              <h2 class="profile__artist">Jacques Cousteau</h2>
              <p class="profile__url-heading">Explorador</p>
            </div>
            <button class="profile__edit-btn"></button>
          </div>
          <button class="profile__add-btn"></button>
        </section>
        <section class="elements elements__section">
          <ul class="elements__grid"></ul>
        </section>
        <template id="template">
          <li class="elements__rectangle">
            <button class="elements__btn-delete"></button>
            <img class="elements__image" src="" alt="" />
            <div class="elements__image-rectangle">
              <p class="elements__image-title"></p>
              <button class="elements__btn-like"></button>
            </div>
          </li>
        </template>
        <div class="popup popup__profile">
          <div class="popup__rectangle">
            <button class="popup__btn-close"></button>
            <form class="popup__form" id="user-form" novalidate>
              <h3 class="popup__title">Editar Perfil</h3>
              <fieldset class="popup__info">
                <label class="popup__label">
                  <input
                    class="popup__input popup__name"
                    type="text"
                    name="name"
                    id="name"
                    placeholder="Nome"
                    minlength="2"
                    maxlength="40"
                    required />
                  <span class="form__input-error name-input-error"></span
                ></label>
                <label class="popup__label">
                  <input
                    class="popup__input popup__job"
                    type="text"
                    name="about"
                    id="profession"
                    placeholder="Sobre Mim"
                    minlength="2"
                    maxlength="200"
                    required
                  />
                  <span class="form__input-error profession-input-error"></span>
                </label>
              </fieldset>
              <button type="submit" class="popup__btn-save">Salvar</button>
            </form>
          </div>
        </div>
        <div class="popup popup-add-card">
          <div class="popup__rectangle">
            <button class="popup__btn-close"></button>
            <form
              class="popup__form popup__form-cards"
              id="card-form"
              novalidate
            >
              <h3 class="popup__title-cards">Novo Local</h3>
              <fieldset class="popup__info">
                <label class="popup__label">
                  <input
                    class="popup__input popup__card-title"
                    type="text"
                    name="name"
                    id="title"
                    placeholder="Título"
                    required
                    minlength="2"
                    maxlength="30" />
                  <span class="form__input-error title-input-error"></span
                ></label>
                <label class="popup__label">
                  <input
                    class="popup__input popup__url"
                    type="url"
                    name="link"
                    id="url"
                    placeholder="link de Imagem"
                    required />
                  <span class="form__input-error url-input-error"></span
                ></label>
              </fieldset>
              <button type="submit" class="popup__btn-save">Salvar</button>
            </form>
          </div>
        </div>
        <div class="popup popup-view-image">
          <div class="popup__container-image-text">
            <button class="popup__btn-close"></button>
            <img class="popup__image-view" src="" alt="" />
            <p class="popup__title-view"></p>
          </div>
        </div>
      </main>
      <footer class="footer">
        <p class="footer__copyright">© 2024 Around The U.S.</p>
      </footer>
    </div>
    <script type="module" src="./script/index.js"></script>
    <script type="module" src="./script/Card.js"></script>
    <script type="module" src="./script/FormValidator.js"></script>
    <script type="module" src="./script/utils.js"></script>
  </body>
</html>
